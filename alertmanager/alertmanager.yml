# ai-generated: 85% - Claude Code filled in the course template's routes and inhibit rule, reviewed by the student
# alertmanager/alertmanager.yml - the routing tree (INCIDENT-SPEC.md I-04 to I-08).
# P1 pages the on-call; P2 and P3 go to chat. While a shop page fires, the shop's own P2/P3 cause alerts are muted
# (they would only repeat the page in chat); `equal: [system]` keeps a shop page from muting svcdesk's alerts.
global:
  resolve_timeout: 5m
route:
  receiver: chat                  # the root: an alert that matches no child ends here
  group_by: [alertname, service]
  group_wait: 10s                 # the first notification of a new group waits this long: it is part of the MTTA
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P1"']
      receiver: pager
    - matchers: ['severity=~"P2|P3"']
      receiver: chat
receivers:
  - name: pager                   # the on-call's phone
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true
inhibit_rules:
  # A firing page mutes the P2 and P3 alerts of the same system: one page, not a page plus a chat storm.
  - source_matchers: ['severity="P1"']
    target_matchers: ['severity=~"P2|P3"']
    equal: [system]
