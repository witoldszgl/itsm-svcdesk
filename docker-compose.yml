# Compose contract of API.md section 9: build, do not pull; no bind mounts; no network at run time.
services:
  svcdesk:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: /data/svcdesk.db
      KB_INDEX_URL: http://kb-index:8080       # Lab 3, M-02
    ports:
      - "8080:8080"
    volumes:
      - svcdesk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20
    depends_on:
      - kb-index
    restart: unless-stopped

  # Lab 3, M-01: the knowledge-base index behind GET /kb/search. No healthcheck: the image has no shell.
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: witoldszgl

  # Lab 3: my own Prometheus and Grafana (never started by the checker), profile "observability".
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Lab 3 Stretch 2 (M-30): Toxiproxy in front of svcdesk; API on 8474, the proxy listens on 8666.
  #   docker compose --profile gap up -d toxiproxy
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["gap"]
    ports:
      - "8474:8474"
      - "8666:8666"

  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      SVCDESK_URL: http://svcdesk:8080
    depends_on:
      svcdesk:
        condition: service_healthy

volumes:
  svcdesk-data:
