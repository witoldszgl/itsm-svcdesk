# Compose contract of API.md section 9: build, do not pull; no bind mounts; no network at run time.
services:
  svcdesk:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: /data/svcdesk.db
    ports:
      - "8080:8080"
    volumes:
      - svcdesk-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20
    restart: unless-stopped

  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      SVCDESK_URL: http://svcdesk:8080
    depends_on:
      svcdesk:
        condition: service_healthy

volumes:
  svcdesk-data:
